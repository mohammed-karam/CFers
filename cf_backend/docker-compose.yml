version: '3.8'

services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://cf_user:cf_password@db:5432/cf_db
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:15
    environment:
      - POSTGRES_USER=cf_user
      - POSTGRES_PASSWORD=cf_password
      - POSTGRES_DB=cf_db
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cf_user"]
      interval: 5s
      timeout: 5s
      retries: 5
